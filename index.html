<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MordeKiller Pairing</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f172a,#111827,#7f1d1d);
}

.card{
width:380px;
padding:30px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(15px);
border-radius:20px;
text-align:center;
color:#fff;
box-shadow:0 15px 40px rgba(0,0,0,.4);
}

.logo{
font-size:55px;
}

h1{
margin:15px 0;
}

p{
opacity:.8;
margin-bottom:20px;
}

input{
width:100%;
padding:15px;
border:none;
outline:none;
border-radius:10px;
font-size:16px;
margin-bottom:20px;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:10px;
background:#ff0000;
color:#fff;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#d10000;
}

#result{
margin-top:20px;
font-size:22px;
font-weight:bold;
color:#00ff99;
word-break:break-all;
}

.footer{
margin-top:25px;
font-size:12px;
opacity:.7;
}
</style>
</head>

<body>

<div class="card">

<div class="logo">🤖</div>

<h1>MordeKiller Bot</h1>

<p>Generate your WhatsApp Pairing Code</p>

<input
id="number"
type="text"
placeholder="254712345678">

<button onclick="pairBot()">
🔥 Pair MordeKiller
</button>

<div id="result"></div>

<div class="footer">
Powered by MordeKiller
</div>

</div>

<script>
async function pairBot(){

const number=document.getElementById("number").value.trim();

if(!number){
return alert("Enter your WhatsApp number.");
}

document.getElementById("result").innerHTML="Generating...";

try{

const response=await fetch("/pair",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({number})
});

const data=await response.json();

if(data.code){

document.getElementById("result").innerHTML=
"🔑 Pair Code:<br><br><span style='font-size:34px'>"+data.code+"</span>";

}else{

document.getElementById("result").innerHTML=
data.error || "Failed to generate code.";

}

}catch(err){

document.getElementById("result").innerHTML=
"Server Offline";

}

}
</script>

</body>
  </html>
